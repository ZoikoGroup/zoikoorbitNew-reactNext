name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GCP VM
        run: |
          echo "${{ secrets.SSH_KEY }}" > /tmp/deploy_key
          chmod 600 /tmp/deploy_key

          ssh -i /tmp/deploy_key \
          -o StrictHostKeyChecking=no \
          ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
          "git config --global --add safe.directory /var/www/html/zoikoorbitNew-reactNext && \
          cd /var/www/html/zoikoorbitNew-reactNext && \

          git pull origin main && \

          rm -rf node_modules .next package-lock.json && \
          npm cache clean --force && \

          npm install && \

          npm install @tailwindcss/oxide-linux-x64-gnu --save-dev && \
          npm install lightningcss-linux-x64-gnu --save-dev && \

          npm run build && \

          pm2 restart zoikoorbit-reactNext && \
          pm2 save"